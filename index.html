<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tam giác bằng nhau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,600;0,8..60,700;1,8..60,600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a worksheet on graph paper. Blue ink for text, red pencil for the equal-marks, one column. */
:root{
  --paper:#f2f6fc; --card:#ffffff; --ink:#13203a; --muted:#54627f; --line:#cdd7e9;
  --grid:rgba(52,96,170,.08); --accent:#1f4fd8; --accent-ink:#ffffff; --mark:#d9342b; --tri:#eaf0fc;
  --good:#17754a; --good-bg:#e4f4ea; --warn:#9a5b00; --warn-bg:#fff0d4; --bad:#b3261e; --bad-bg:#fde8e6;
  --display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
    --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
    --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1730; --card:#142245; --ink:#e8eefc; --muted:#9fb0d4; --line:#2b3c6b;
  --grid:rgba(140,170,255,.07); --accent:#8aa9ff; --accent-ink:#0d1730; --mark:#ff7f72; --tri:#1a2b57;
  --good:#58d19a; --good-bg:#12372d; --warn:#f3b955; --warn-bg:#3b2d10; --bad:#ff8a80; --bad-bg:#40191b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font:16px/1.65 var(--body); -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.top b{color:var(--ink);font-weight:600;letter-spacing:.02em}
.top nav{display:flex;gap:16px}
.top nav a{color:var(--muted);text-decoration:none;border-bottom:1.5px solid transparent;padding-bottom:1px}
.top nav a[aria-current="page"]{color:var(--ink);border-color:var(--mark)}

h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.3rem,8vw,3.9rem);font-weight:700;letter-spacing:-.01em}
h1 em{color:var(--accent);font-weight:600}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
.lead{font-size:1.08rem;color:var(--muted);max-width:56ch;margin:14px 0 0}

.hero{padding:12px 0 8px}
.hero .fig{margin-top:18px;max-width:420px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.86rem}

.btn{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;border-radius:10px;cursor:pointer;min-height:46px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.sm{padding:8px 14px;min-height:38px;font-size:.9rem}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.82rem}
label.fl{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}

/* worksheet figures */
.fig{display:block;width:100%;height:auto}
.fig .tri,.fig .seg{fill:var(--tri);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .seg{fill:none}
.fig .thin{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:4 4}
.fig .mk{stroke:var(--mark);stroke-width:2.2;stroke-linecap:round;fill:none}
.fig .vl{fill:var(--ink);font:600 15px var(--display)}
.fig .draw{stroke-dasharray:700;stroke-dashoffset:0;animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:700}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.fig .draw{animation:none}}
.figbox{background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:8px;max-width:400px;margin:10px 0}

/* home */
.grp{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark);margin:18px 0 8px}
.grp:first-of-type{margin-top:6px}
.pack{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.pk{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:68px}
.pk:hover{border-color:var(--accent)}
.pk b{font-family:var(--display);font-size:1.02rem}
.pk span{font-size:.84rem;color:var(--muted);line-height:1.4}
.pk[disabled]{opacity:.55;cursor:not-allowed}
.pk[disabled]:hover{border-color:var(--line)}
.recap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.recap{grid-template-columns:1fr 1fr}}
.recap .card{display:flex;flex-direction:column;gap:6px}
.recap h3{font-size:1.02rem}
.recap p{margin:0;font-size:.93rem}
.chip{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--paper);white-space:nowrap}

/* quiz */
.bar-sticky{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);margin:0 -16px 16px;padding:10px 16px}
.timer{font-variant-numeric:tabular-nums;font-size:.95rem}
.timer.low{color:var(--bad)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.part{margin:28px 0 12px}
.part .kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mark)}
.part p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.q{margin-bottom:14px}
.qh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.qn{font-weight:700;font-family:var(--display);font-size:1.08rem}
.stem{margin:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card)}
.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .ol{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:.85rem}
.opt:has(input:checked){border-color:var(--accent);background:var(--tri)}
.opt:has(input:checked) .ol{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt:has(input:disabled){cursor:default}
.opt:has(input:disabled):hover{border-color:var(--line)}
.opt.is-right,.opt.is-right:hover{border-color:var(--good);background:var(--good-bg)}
.opt.is-right .ol{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.is-wrong,.opt.is-wrong:hover{border-color:var(--bad);background:var(--bad-bg)}
.opt.is-wrong .ol{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.tf{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.tfr{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px dashed var(--line)}
.tfr .tx{flex:1 1 260px}
.tfr .tx b{font-family:var(--display);margin-right:6px}
.tfr .exp{flex-basis:100%;margin-top:0}
.tfb{display:flex;gap:8px}
.tfb .opt{padding:7px 16px;border-radius:99px;font-weight:600;font-size:.92rem}
.sa{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sa input{max-width:180px}
.warnbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:12px 14px;margin-top:16px}
.feed{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:.94rem}
.feed.ok{background:var(--good-bg);color:var(--good)}
.feed.bad{background:var(--bad-bg);color:var(--bad)}
.feed.info{background:var(--warn-bg);color:var(--warn)}
.exp{background:var(--paper);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:.94rem}

/* results */
.score{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1;letter-spacing:-.02em}
.big small{font-size:.4em;color:var(--muted);font-weight:600}
.parts{display:flex;gap:8px;flex-wrap:wrap}
.parts .chip{font-size:.85rem;padding:5px 12px}
.topic{padding:14px 0;border-top:1px solid var(--line)}
.topic:first-child{border-top:0;padding-top:0}
.trow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.track{height:12px;border-radius:99px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.st{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.st.good{background:var(--good-bg);color:var(--good)}
.st.warn{background:var(--warn-bg);color:var(--warn)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.fill-good{background:var(--good)} .fill-warn{background:var(--warn)} .fill-bad{background:var(--bad)}
.advice{border-left:4px solid var(--mark);padding:2px 0 2px 14px;margin:10px 0}
.advice p{margin:4px 0}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
details.rv{border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:8px}
details.rv summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;list-style:none}
details.rv summary::-webkit-details-marker{display:none}
details.rv .body{padding:0 14px 14px;border-top:1px dashed var(--line)}
.mark-ok{color:var(--good);font-weight:700} .mark-no{color:var(--bad);font-weight:700}
.ans-line{margin:6px 0;font-size:.94rem}
.codebox{display:flex;flex-direction:column;gap:8px}

table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.cell{font-weight:600;text-align:center}
td.cell.good{color:var(--good)} td.cell.warn{color:var(--warn)} td.cell.bad{color:var(--bad)}
.tablewrap{overflow-x:auto}
[hidden]{display:none!important}
footer{margin-top:40px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <b>Toán 7 · Kết nối tri thức · Chương Tam giác bằng nhau</b>
    <nav aria-label="Chọn chế độ">
      <a href="#" id="nav-hs" aria-current="page">Học sinh</a>
      <a href="#giao-vien" id="nav-gv">Giáo viên</a>
    </nav>
  </header>

  <main id="app"></main>

  <footer>Bài luyện chấm tự động ngay trên trình duyệt. Kết quả không được lưu trên máy chủ; học sinh gửi mã kết quả của bài kiểm tra cho giáo viên để tổng hợp.</footer>
</div>

<script>
"use strict";
/* ============ Hình vẽ ============ */
const PT={A:[20,118],B:[150,118],C:[70,26]};
const f1=n=>(Math.round(n*10)/10);
function ticks(p,q,n){
  const mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2,dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy);
  const ux=dx/len,uy=dy/len,nx=-uy,ny=ux;let s='';
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*5,cx=mx+ux*o,cy=my+uy*o;
    s+=`<line class="mk" x1="${f1(cx-nx*5)}" y1="${f1(cy-ny*5)}" x2="${f1(cx+nx*5)}" y2="${f1(cy+ny*5)}"/>`;}
  return s;
}
function arcs(v,p,q,n){
  const a1=Math.atan2(p[1]-v[1],p[0]-v[0]),a2=Math.atan2(q[1]-v[1],q[0]-v[0]);
  let d=a2-a1;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
  const sw=d>0?1:0;let s='';
  for(let i=0;i<n;i++){const r=16+i*5;
    s+=`<path class="mk" d="M${f1(v[0]+r*Math.cos(a1))} ${f1(v[1]+r*Math.sin(a1))} A${r} ${r} 0 0 ${sw} ${f1(v[0]+r*Math.cos(a2))} ${f1(v[1]+r*Math.sin(a2))}"/>`;}
  return s;
}
function drawTri(off,lab,o){
  const P={A:[PT.A[0]+off,PT.A[1]],B:[PT.B[0]+off,PT.B[1]],C:[PT.C[0]+off,PT.C[1]]};
  let s=`<polygon class="tri${o.anim?' draw':''}" points="${[P.A,P.B,P.C].map(p=>p.join(',')).join(' ')}"/>`;
  const sd=o.sides||{},ag=o.ang||{};
  [['AB','A','B'],['BC','B','C'],['CA','C','A']].forEach(([k,p,q])=>{if(sd[k])s+=ticks(P[p],P[q],sd[k]);});
  [['A','B','C'],['B','C','A'],['C','A','B']].forEach(([v,p,q])=>{if(ag[v])s+=arcs(P[v],P[p],P[q],ag[v]);});
  const L={A:[-12,15],B:[11,15],C:[0,-8]};
  ['A','B','C'].forEach((v,i)=>{s+=`<text class="vl" x="${P[v][0]+L[v][0]}" y="${P[v][1]+L[v][1]}" text-anchor="middle">${lab[i]}</text>`;});
  return s;
}
function figTwo(o){
  o=o||{};const l1=o.l1||['A','B','C'],l2=o.l2||['D','E','F'];
  return `<svg class="fig" viewBox="0 0 360 150" role="img" aria-label="${o.alt||'Hình hai tam giác có kí hiệu các yếu tố bằng nhau'}">${drawTri(0,l1,o)}${drawTri(190,l2,o)}</svg>`;
}
function figIso(o){
  const A=[120,22],B=[35,118],C=[205,118],P=[120,118];
  let s=`<polygon class="tri" points="${A} ${B} ${C}"/><line class="seg" x1="120" y1="22" x2="120" y2="118"/>`;
  const t=o.ticks||{};
  if(t.AB)s+=ticks(A,B,t.AB);if(t.AC)s+=ticks(A,C,t.AC);if(t.BP)s+=ticks(B,P,t.BP);if(t.PC)s+=ticks(P,C,t.PC);
  if(o.arcA){s+=arcs(A,B,P,1)+arcs(A,P,C,1);}
  if(o.right)s+=`<path class="mk" d="M114 118 L114 112 L120 112"/>`;
  s+=`<text class="vl" x="120" y="14" text-anchor="middle">A</text><text class="vl" x="24" y="132" text-anchor="middle">B</text><text class="vl" x="216" y="132" text-anchor="middle">C</text><text class="vl" x="120" y="136" text-anchor="middle">${o.pt}</text>`;
  return `<svg class="fig" viewBox="0 0 240 145" role="img" aria-label="${o.alt}">${s}</svg>`;
}
function figCross(v){
  const A=[40,30],B=[200,120],C=[40,120],D=[200,30],O=[120,75];
  let s=`<line class="seg" x1="40" y1="30" x2="200" y2="120"/><line class="seg" x1="40" y1="120" x2="200" y2="30"/>`;
  s+=`<line class="thin" x1="40" y1="30" x2="40" y2="120"/><line class="thin" x1="200" y1="30" x2="200" y2="120"/>`;
  if(v===2){s+=ticks(O,A,1)+ticks(O,B,1)+arcs(A,O,C,1)+arcs(B,O,D,1);}
  else{s+=ticks(O,A,1)+ticks(O,B,1)+ticks(O,C,2)+ticks(O,D,2);}
  const T=(x,y,t)=>`<text class="vl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;
  s+=T(28,26,'A')+T(28,138,'C')+T(212,138,'B')+T(212,26,'D')+T(134,94,'O');
  return `<svg class="fig" viewBox="0 0 240 150" role="img" aria-label="Hai đoạn thẳng AB và CD cắt nhau tại O">${s}</svg>`;
}
function figKite(){
  const A=[120,18],B=[120,126],C=[50,72],D=[190,72];
  let s=`<polygon class="tri" points="${A} ${C} ${B} ${D}"/><line class="seg" x1="120" y1="18" x2="120" y2="126"/>`;
  s+=ticks(A,C,1)+ticks(A,D,1)+ticks(C,B,2)+ticks(D,B,2);
  const T=(x,y,t)=>`<text class="vl" x="${x}" y="${y}" text-anchor="middle">${t}</text>`;
  s+=T(120,12,'A')+T(120,142,'B')+T(38,76,'C')+T(202,76,'D');
  return `<svg class="fig" viewBox="0 0 240 150" role="img" aria-label="Hai tam giác ABC và ABD có chung cạnh AB, C và D khác phía">${s}</svg>`;
}
const fb=svg=>`<div class="figbox">${svg}</div>`;

/* ============ Chủ đề ============ */
const TOPICS={
  tu:{short:'Tương ứng',name:'Hai tam giác bằng nhau',rule:'Hai tam giác bằng nhau thì các cạnh tương ứng bằng nhau và các góc tương ứng bằng nhau.',tip:'Đọc đúng thứ tự đỉnh trong kí hiệu. Với ΔABC = ΔMNP thì A↔M, B↔N, C↔P; cạnh hay góc nào nối các đỉnh tương ứng thì bằng nhau.'},
  ccc:{short:'c.c.c',name:'Trường hợp cạnh – cạnh – cạnh',rule:'Nếu ba cạnh của tam giác này bằng ba cạnh của tam giác kia thì hai tam giác đó bằng nhau.',tip:'Chỉ cần đủ ba cặp cạnh tương ứng bằng nhau, không cần xét góc. Mới có hai cặp cạnh thì chưa đủ.'},
  cgc:{short:'c.g.c',name:'Trường hợp cạnh – góc – cạnh',rule:'Nếu hai cạnh và góc xen giữa của tam giác này bằng hai cạnh và góc xen giữa của tam giác kia thì hai tam giác đó bằng nhau.',tip:'Góc phải nằm xen giữa hai cạnh đã cho. Nếu góc không kẹp giữa hai cạnh thì chưa đủ để kết luận.'},
  gcg:{short:'g.c.g',name:'Trường hợp góc – cạnh – góc',rule:'Nếu một cạnh và hai góc kề cạnh đó của tam giác này bằng một cạnh và hai góc kề cạnh đó của tam giác kia thì hai tam giác đó bằng nhau.',tip:'Cạnh phải kề với cả hai góc đã cho. Chỉ có hai cặp góc bằng nhau thì chưa đủ, vì các cạnh có thể dài ngắn khác nhau.'}
};
const TKEYS=['tu','ccc','cgc','gcg'];
const LEVELS={NB:'Nhận biết',TH:'Thông hiểu',VD:'Vận dụng'};
const LEVEL_DESC={NB:'Nhận ra trường hợp bằng nhau, đọc kí hiệu và hình vẽ.',TH:'Chọn điều kiện cần thêm, tính góc và cạnh tương ứng.',VD:'Chứng minh và tính toán qua nhiều bước.'};
let RNG=Math.random,SEEDED=false;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============ Bộ sinh đề tự đổi ============ */
const LBL=[['A','B','C','D','E','F'],['A','B','C','M','N','P'],['M','N','P','X','Y','Z'],['D','E','F','M','N','P'],['H','K','L','X','Y','Z'],['P','Q','R','X','Y','Z']];
function ctx(){const l=LBL[ri(0,LBL.length-1)];return {v:l.slice(0,3),w:l.slice(3),t1:'Δ'+l.slice(0,3).join(''),t2:'Δ'+l.slice(3).join('')};}
function sideP(c,i,j){return ri(0,9)<3?`${c.v[j]}${c.v[i]} = ${c.w[j]}${c.w[i]}`:`${c.v[i]}${c.v[j]} = ${c.w[i]}${c.w[j]}`;}
function angP(c,i){return `∠${c.v[i]} = ∠${c.w[i]}`;}
function joinConds(a){a=shuffle(a);return a.length>1?a.slice(0,-1).join(', ')+' và '+a[a.length-1]:a[0];}
const CASE_OPT={ccc:'Cạnh – cạnh – cạnh (c.c.c)',cgc:'Cạnh – góc – cạnh (c.g.c)',gcg:'Góc – cạnh – góc (g.c.g)',none:'Chưa đủ điều kiện để kết luận'};
const CASE_SHORT={ccc:'c.c.c',cgc:'c.g.c',gcg:'g.c.g'};

/* Tình huống: các điều kiện bằng nhau của hai tam giác và kết luận đúng */
function scen(kind,c){
  const j=ri(0,2),i=(j+1)%3,k=(j+2)%3,v=c.v,t=`${c.t1} = ${c.t2}`;
  const SD=(a,b)=>sideP(c,a,b),AN=a=>angP(c,a);
  switch(kind){
    case 'ccc':return {kind:'ccc',conds:[SD(0,1),SD(1,2),SD(2,0)],exp:`Có đủ ba cặp cạnh tương ứng bằng nhau nên ${t} theo trường hợp c.c.c.`};
    case 'cgc':return {kind:'cgc',conds:[SD(i,j),AN(j),SD(j,k)],exp:`Góc ${v[j]} xen giữa hai cạnh ${v[i]}${v[j]} và ${v[j]}${v[k]}. Hai cạnh và góc xen giữa bằng nhau nên ${t} (c.g.c).`};
    case 'gcg':return {kind:'gcg',conds:[AN(i),SD(i,j),AN(j)],exp:`Cạnh ${v[i]}${v[j]} kề với hai góc ${v[i]} và ${v[j]}. Một cạnh và hai góc kề bằng nhau nên ${t} (g.c.g).`};
    case 'ssa':return {kind:'none',trap:'ssa',conds:[SD(i,j),SD(j,k),AN(i)],exp:`Hai cạnh bằng nhau là ${v[i]}${v[j]} và ${v[j]}${v[k]}, góc xen giữa chúng là ∠${v[j]} chứ không phải ∠${v[i]}. Hai cạnh và một góc không xen giữa chưa đủ để kết luận.`};
    case 'ss':return {kind:'none',trap:'ss',conds:[SD(i,j),SD(j,k)],exp:'Mới có hai cặp cạnh bằng nhau; cần thêm cạnh thứ ba (c.c.c) hoặc góc xen giữa (c.g.c).'};
    case 'aaa':return {kind:'none',trap:'aaa',conds:[AN(0),AN(1),AN(2)],exp:'Ba cặp góc bằng nhau chưa đủ: hai tam giác có thể có độ dài các cạnh khác nhau. Cần thêm một cặp cạnh bằng nhau.'};
    default:return {kind:'none',trap:'sa',conds:[SD(i,j),AN(i)],exp:'Mới có một cặp cạnh và một cặp góc, chưa đủ để dùng c.g.c hay g.c.g.'};
  }
}
function caseErr(s,chosen){
  if(s.kind!=='none'){
    const E={
      ccc:{cgc:'Giả thiết chỉ cho ba cặp cạnh, không có cặp góc nào nên không phải c.g.c.',gcg:'Giả thiết không có cặp góc nào bằng nhau nên không phải g.c.g.',none:'Ba cặp cạnh tương ứng bằng nhau đã đủ để kết luận theo c.c.c.'},
      cgc:{ccc:'Giả thiết chỉ có hai cặp cạnh và một cặp góc, chưa đủ ba cặp cạnh.',gcg:'Giả thiết chỉ có một cặp góc bằng nhau nên không phải g.c.g.',none:'Góc xen giữa hai cặp cạnh bằng nhau, đủ để kết luận theo c.g.c.'},
      gcg:{ccc:'Giả thiết chỉ có một cặp cạnh bằng nhau.',cgc:'Giả thiết chỉ có một cặp cạnh và hai cặp góc, không có hai cặp cạnh.',none:'Cạnh kề với hai góc đã cho, đủ để kết luận theo g.c.g.'}};
    return E[s.kind][chosen];
  }
  const T={
    ssa:{ccc:'Mới có hai cặp cạnh bằng nhau, chưa có cặp cạnh thứ ba.',cgc:'Góc bằng nhau không nằm xen giữa hai cạnh bằng nhau, nên chưa dùng được c.g.c.',gcg:'Giả thiết chỉ có một cặp góc bằng nhau nên không phải g.c.g.'},
    ss:{ccc:'Mới có hai cặp cạnh bằng nhau, chưa có cặp cạnh thứ ba.',cgc:'Giả thiết không có cặp góc nào bằng nhau.',gcg:'Giả thiết không có cặp góc nào bằng nhau.'},
    aaa:{ccc:'Giả thiết không có cặp cạnh nào bằng nhau.',cgc:'Giả thiết không có cặp cạnh nào bằng nhau.',gcg:'Ba cặp góc bằng nhau nhưng không có cặp cạnh nào, nên chưa đủ g.c.g (cần thêm một cặp cạnh).'},
    sa:{ccc:'Mới có một cặp cạnh bằng nhau.',cgc:'Mới có một cặp cạnh và một cặp góc, thiếu thêm một cặp cạnh.',gcg:'Mới có một cặp cạnh và một cặp góc, thiếu thêm một cặp góc kề cạnh đó.'}};
  return T[s.trap][chosen];
}
function genCase(kinds){return ()=>{
  const c=ctx(),s=scen(kinds[ri(0,kinds.length-1)],c),order=['ccc','cgc','gcg','none'];
  return {
    stem:`Cho ${c.t1} và ${c.t2} có ${joinConds(s.conds)}. ${s.kind==='none'?'Kết luận nào sau đây đúng?':`Theo trường hợp nào thì ${c.t1} = ${c.t2}?`}`,
    opts:order.map(k=>k===s.kind?{t:CASE_OPT[k]}:{t:CASE_OPT[k],err:caseErr(s,k)}),
    ans:order.indexOf(s.kind),exp:s.exp};
};}
function genNeed(kind){return ()=>{
  const c=ctx(),j=ri(0,2),i=(j+1)%3,k=(j+2)%3,v=c.v;
  const SD=(a,b)=>`${v[a]}${v[b]} = ${c.w[a]}${c.w[b]}`,AN=a=>`∠${v[a]} = ∠${c.w[a]}`;
  let given,good,bad,exp;
  if(kind==='ccc'){
    given=[SD(i,j),SD(j,k)];good=SD(k,i);
    bad=[{t:AN(j),err:'Hai cạnh và góc xen giữa bằng nhau là trường hợp c.g.c, không phải c.c.c.'},
         {t:AN(i),err:'c.c.c chỉ dùng ba cặp cạnh; một cặp góc không thay được cặp cạnh thứ ba.'},
         {t:AN(k),err:'c.c.c chỉ dùng ba cặp cạnh; một cặp góc không thay được cặp cạnh thứ ba.'}];
    exp=`c.c.c cần ba cặp cạnh bằng nhau. Đã có ${given.join(' và ')} nên cần thêm ${good}.`;
  }else if(kind==='cgc'){
    given=[SD(i,j),AN(j)];good=SD(j,k);
    bad=[{t:SD(k,i),err:`Cạnh ${v[k]}${v[i]} đối diện với góc ${v[j]}, không kẹp góc ${v[j]}, nên chưa thành c.g.c.`},
         {t:AN(i),err:'Một cạnh và hai góc kề cạnh đó là trường hợp g.c.g, không phải c.g.c.'},
         {t:AN(k),err:`Thêm một cặp góc không tạo ra cặp cạnh kẹp góc ${v[j]}, nên không thành c.g.c.`}];
    exp=`Góc ${v[j]} xen giữa hai cạnh ${v[i]}${v[j]} và ${v[j]}${v[k]}. Đã có ${given.join(' và ')} nên cần thêm ${good}.`;
  }else{
    given=[AN(i),SD(i,j)];good=AN(j);
    bad=[{t:SD(i,k),err:`Thêm ${v[i]}${v[k]} thì có hai cạnh và góc xen giữa (c.g.c), không phải g.c.g.`},
         {t:SD(j,k),err:`Cạnh ${v[j]}${v[k]} cùng cạnh ${v[i]}${v[j]} không kẹp góc ${v[i]}, nên chưa đủ để kết luận.`},
         {t:AN(k),err:`Góc ${v[k]} không kề cạnh ${v[i]}${v[j]} nên không thành g.c.g.`}];
    exp=`Cạnh ${v[i]}${v[j]} kề hai góc ${v[i]} và ${v[j]}. Đã có ${given.join(' và ')} nên cần thêm ${good}.`;
  }
  return {stem:`Cho ${c.t1} và ${c.t2} có ${given.join(' và ')}. Cần thêm điều kiện nào để ${c.t1} = ${c.t2} theo trường hợp ${CASE_SHORT[kind]}?`,
    opts:[{t:good}].concat(bad),ans:0,exp};
};}
function genCorr(isAngle){return ()=>{
  const c=ctx(),v=c.v,w=c.w,i=ri(0,2),j=(i+1)%3,k=(i+2)%3;
  const map=`${v[0]}↔${w[0]}, ${v[1]}↔${w[1]}, ${v[2]}↔${w[2]}`;
  const err=`Ghép sai cặp đỉnh tương ứng (${map}).`;
  let good,bad;
  if(isAngle){good=`∠${v[i]} = ∠${w[i]}`;bad=[`∠${v[i]} = ∠${w[j]}`,`∠${v[i]} = ∠${w[k]}`,`∠${v[j]} = ∠${w[i]}`];}

/* Đúng sai: mỗi ý là một tình huống điều kiện riêng */
function genTF(k,easy){return ()=>{
  const trapKinds={ccc:['ss'],cgc:['ssa'],gcg:['aaa','sa']}[k],others=['ccc','cgc','gcg'].filter(x=>x!==k);
  const pickTrap=()=>trapKinds[ri(0,trapKinds.length-1)];
  for(let tries=0;tries<40;tries++){
    const c=ctx(),items=[],keys=[];
    const put=(s,claim,v,level,exp)=>{
      keys.push(s.conds.slice().sort().join('|')+'>'+claim);
      items.push({t:`Nếu ${joinConds(s.conds)} thì ${c.t1} = ${c.t2} theo trường hợp ${CASE_SHORT[claim]}.`,v,topic:k,level,exp});
    };
    const stem=`Cho ${c.t1} và ${c.t2} (các đỉnh ${c.v.join(', ')} lần lượt ứng với ${c.w.join(', ')}). Mỗi ý dưới đây là một tình huống riêng.`;
    let s=scen(k,c);put(s,k,true,'NB',s.exp);
    if(easy){
      others.forEach(o=>{s=scen(k,c);put(s,o,false,'NB',`Các điều kiện này thuộc trường hợp ${CASE_SHORT[k]}, không phải ${CASE_SHORT[o]}. ${s.exp}`);});
      s=scen(pickTrap(),c);put(s,k,false,'NB',s.exp);
      if(new Set(keys).size<4)continue;
      return {stem,items:shuffle(items)};
    }
    s=scen(pickTrap(),c);put(s,k,false,'TH',s.exp);
    const o=others[ri(0,1)];s=scen(k,c);put(s,o,false,'TH',`Các điều kiện này thuộc trường hợp ${CASE_SHORT[k]}, không phải ${CASE_SHORT[o]}. ${s.exp}`);
    if(k!=='ccc'&&ri(0,1)){s=scen(k,c);put(s,k,true,'TH',s.exp);}
    else{s=scen(pickTrap(),c);put(s,k,false,'VD',s.exp);}
    if(new Set(keys).size<4)continue;
    return {stem,items:shuffle(items)};
  }
  return null;
};}

function updateTimer(){
  if(state.view!=='quiz'||!S)return;

  if(S.mode!=='practice'){

function pick(pool,used){
  const x=ordered(pool.filter(x=>!used.has(x.id)))[0];used.add(x.id);return x;
}
function makeSession(mode,spec,title,by){
  const list=[];TYPES.forEach(t=>by[t]=by[t].map(inst));
  TYPES.forEach(t=>by[t].forEach(q=>list.push(q)));
  const idx={};TYPES.forEach(t=>by[t].forEach((q,i)=>idx[q.id]=i));
  state.ans={};state.pr={};state.result=null;state.perm={};
  state.t0=Date.now();state.elapsed=0;state.timedOut=false;if(!SEEDED)markSeen(list);
  {const keep=RNG;RNG=Math.random;by.mc.forEach(q=>{state.perm[q.id]=shuffle(q.opts.map((_,i)=>i));});RNG=keep;}
  S={mode,spec,title,by,list,idx};
}
function buildTest(){
  const used=new Set();
  const mcSlots=[['tu',['NB']],['ccc',['NB','TH']],['cgc',['NB','TH']],['gcg',['NB','TH']],['tu',['TH']],[null,['VD']]];
  const mc=mcSlots.map(([t,l])=>pick(MC.filter(q=>(!t||q.topic===t)&&l.includes(q.level)),used));
  const tf=['ccc','cgc','gcg'].map(t=>pick(TF.filter(q=>q.topic===t),used));
  const sa=TKEYS.map(t=>pick(SA.filter(q=>q.topic===t&&q.level!=='NB'),used));
  makeSession('test',null,'Bài kiểm tra',{mc,tf,sa});
}
function buildQuick(){
  const used=new Set(),T3=['ccc','cgc','gcg'];
  const gcOK=q=>q.id.startsWith('gc_')&&!q.id.includes('_t_'),gcTrap=q=>q.id.startsWith('gc_')&&q.id.includes('_t_');
  const t1=T3[ri(0,2)],t4=T3[ri(0,2)];
  const mc=[
    pick(MC.filter(q=>gcOK(q)&&q.topic===t1),used),
    pick(MC.filter(q=>q.id.startsWith('nd_cgc_')),used),
    pick(MC.filter(q=>q.id.startsWith('nd_gcg_')),used),
    pick(MC.filter(q=>gcTrap(q)&&q.topic===t4),used)
  ];
  const sa=[pick(SA.filter(q=>q.topic==='gcg'&&q.level!=='VD'),used),pick(SA.filter(q=>(q.topic==='ccc'||q.topic==='cgc')&&q.level!=='VD'),used)];
  makeSession('quick',null,'Kiểm tra nhanh',{mc,tf:[],sa});
}
function buildPractice(spec){
  let f,title;
  if(spec.kind==='level'){f=q=>q.level===spec.val;title='Gói '+LEVELS[spec.val];}
  else if(spec.kind==='topic'){f=q=>q.topic===spec.val;title='Gói '+TOPICS[spec.val].short;}
  else{f=q=>spec.topics.includes(q.topic);title='Gói ôn điểm yếu';}
  const nSA=spec.kind==='topic'?4:3;
  const take=(arr,n)=>ordered(arr.filter(f)).slice(0,n);
  makeSession('practice',spec,title,{mc:take(MC,6),tf:take(TF,2),sa:take(SA,nSA)});
}

    <p class="stem">${q.stem}</p>${q.fig||''}
    <div class="opts" role="radiogroup" aria-label="Câu ${i+1}">${opts}</div>${pr?tail(q,P):''}</article>`;

function tfHTML(q,i){
  const pr=S.mode==='practice',P=pr?(state.pr[q.id]||{}):{},done=!!P.done,a=state.ans[q.id]||[];
  const rows=q.items.map((it,j)=>{
    const cls=v=>{let c='opt';if(done){if(it.v===v)c+=' is-right';else if(a[j]===v)c+=' is-wrong';}return c;};
    const dis=done?'disabled':'';
    return `<div class="tfr"><div class="tx">${q.items.length>1?`<b>${'abcd'[j]})</b>`:''}${it.t}</div>

        <label class="${cls(true)}"><input type="radio" name="${q.id}-${j}" value="1" ${a[j]===true?'checked':''} ${dis}><span>Đúng</span></label>

      </div>${done?`<div class="exp"><b>Đáp án: ${it.v?'Đúng':'Sai'}.</b> ${it.exp}</div>`:''}</div>`;

function saHTML(q,i){
  const pr=S.mode==='practice',P=pr?(state.pr[q.id]||{}):{},done=!!P.done;
  return `<article class="card q" id="q-${q.id}"><div class="qh"><span class="qn">Câu ${i+1}</span>${pr&&done?badge(P):''}</div>

    <div class="sa"><label class="fl" for="in-${q.id}" style="margin:0">Đáp án:</label>
    <input type="text" id="in-${q.id}" data-sa="${q.id}" inputmode="decimal" autocomplete="off" placeholder="Nhập số" value="${esc(state.ans[q.id]||'')}" ${done?'disabled':''}>
    <span class="muted">${q.unit}</span></div>${pr?tail(q,P):''}</article>`;

const CARD={mc:mcHTML,tf:tfHTML,sa:saHTML};

/* ============ Màn hình: làm bài ============ */
function partHead(k,t,d){return `<div class="part">${k?`<div class="kicker">${k}</div>`:''}<h2>${t}</h2><p>${d}</p></div>`;}
function quizHTML(){
  const test=S.mode!=='practice',quick=S.mode==='quick';
  const desc={
    mc:test?(quick?'Mỗi câu chỉ có một đáp án đúng. 1,25 điểm mỗi câu.':'Mỗi câu chỉ có một đáp án đúng. 0,5 điểm mỗi câu.'):'Chọn một đáp án rồi bấm Kiểm tra.',
    tf:test?(quick?'Mỗi câu là một mệnh đề, chọn Đúng hoặc Sai. 1,25 điểm mỗi câu.':'Mỗi câu có 4 ý, chọn Đúng hoặc Sai cho từng ý. Đúng 1 ý được 0,1 điểm, 2 ý được 0,25, 3 ý được 0,5, cả 4 ý được 1 điểm.'):'Chọn Đúng hoặc Sai cho cả 4 ý rồi bấm Kiểm tra.',
    sa:test?(quick?'Nhập kết quả là một số. Có thể dùng dấu phẩy hoặc dấu chấm. 2,5 điểm mỗi câu.':'Nhập kết quả là một số. Có thể dùng dấu phẩy hoặc dấu chấm. 1 điểm mỗi câu.'):'Nhập kết quả là một số rồi bấm Kiểm tra.'
  };
  const heads={mc:['Phần I','Câu hỏi nhiều lựa chọn'],tf:[quick?'Phần I':'Phần II','Câu hỏi đúng sai'],sa:[quick?'Phần II':'Phần III','Câu hỏi trả lời ngắn']};
  let body='';
  TYPES.forEach(t=>{
    if(!S.by[t].length)return;
    body+=partHead(test?heads[t][0]:'',test?heads[t][1]:TYPE_NAME[t],desc[t]);
    body+=`<div class="stack">${S.by[t].map(CARD[t]).join('')}</div>`;
  });
  return `<div class="bar-sticky"><div class="row" style="justify-content:space-between"><b id="plabel"></b><span class="small muted">${test?esc(state.name||'Học sinh'):S.title}</span><b id="timer" class="timer"></b></div><div class="prog"><i id="pbar"></i></div></div>
  ${body}
  <div id="warn"></div>
  <div class="row" style="margin-top:22px"><button class="btn" id="submit">${test?'Nộp bài':'Xem kết quả'}</button><button class="btn ghost" id="back">Quay lại</button></div>`;
}
function totalItems(){return S.list.reduce((s,q)=>s+(q.type==='tf'?q.items.length:1),0);}
function answered(){
  let n=0;
  S.by.mc.forEach(q=>{if(state.ans[q.id]!=null)n++;});
  S.by.tf.forEach(q=>{const a=state.ans[q.id]||[];q.items.forEach((_,j)=>{if(typeof a[j]==='boolean')n++;});});
  S.by.sa.forEach(q=>{if(String(state.ans[q.id]||'').trim()!=='')n++;});
  return n;
}
function doneCount(){return S.list.filter(q=>state.pr[q.id]&&state.pr[q.id].done).length;}
function updateProgress(){
  const l=document.getElementById('plabel'),b=document.getElementById('pbar');if(!l)return;
  if(S.mode!=='practice'){const n=answered(),t=totalItems();l.textContent=`Đã trả lời ${n}/${t}`;b.style.width=(100*n/t)+'%';}
  else{const n=doneCount(),t=S.list.length;l.textContent=`Đã hoàn thành ${n}/${t} câu`;b.style.width=(100*n/t)+'%';}
}

/* ============ Chấm điểm ============ */
function parseNum(s){
  s=String(s).trim().replace(/,/g,'.').replace(/[^0-9.\-\/]/g,'');
  if(!s)return NaN;
  if(s.includes('/')){const [a,b]=s.split('/');return parseFloat(a)/parseFloat(b);}
  return parseFloat(s);
}
function evalQ(q,a){
  if(q.type==='mc')return [a===q.ans];
  if(q.type==='tf'){a=a||[];return q.items.map((it,j)=>a[j]===it.v);}
  const v=parseNum(a==null?'':a);
  return [!isNaN(v)&&q.ans.some(x=>Math.abs(x-v)<1e-6)];
}
function grade(){
  const test=S.mode!=='practice',quick=S.mode==='quick';
  const items=[],sc={mc:0,tf:0,sa:0},errs=[],qres=[];
  const ansOf=q=>test?state.ans[q.id]:(state.pr[q.id]&&state.pr[q.id].firstAns);
  const oksOf=q=>{
    if(test)return evalQ(q,ansOf(q));
    const P=state.pr[q.id];return P&&P.first?P.first:Array(q.type==='tf'?q.items.length:1).fill(false);
  };
  S.by.mc.forEach((q,i)=>{
    const a=ansOf(q),ok=oksOf(q)[0];
    if(ok)sc.mc+=quick?1.25:0.5;else if(a!=null&&q.opts[a]&&q.opts[a].err)errs.push({where:lbl('mc',i),topic:q.topic,text:q.opts[a].err});
    items.push({topic:q.topic,level:q.level,ok,label:lbl('mc',i)});
    qres.push({kind:'mc',q,i,a,ok,pts:ok?(quick?1.25:0.5):0,max:quick?1.25:0.5});
  });
  S.by.tf.forEach((q,i)=>{
    const a=ansOf(q)||[],oks=oksOf(q);let k=0;
    q.items.forEach((it,j)=>{
      const ok=oks[j];if(ok)k++;
      items.push({topic:it.topic,level:it.level,ok,label:lbl('tf',i,q.items.length>1?j:null)});
      if(!ok&&typeof a[j]==='boolean')errs.push({where:lbl('tf',i,q.items.length>1?j:null),topic:it.topic,text:it.exp});
    });
    const pts=quick?(k?1.25:0):TF_SCORE[k];sc.tf+=pts;
    qres.push({kind:'tf',q,i,a,oks,k,pts,max:quick?1.25:1});
  });
  S.by.sa.forEach((q,i)=>{
    const raw=ansOf(q)||'',ok=oksOf(q)[0];
    if(ok)sc.sa+=quick?2.5:1;
    items.push({topic:q.topic,level:q.level,ok,label:lbl('sa',i)});
    qres.push({kind:'sa',q,i,raw,ok,pts:ok?(quick?2.5:1):0,max:quick?2.5:1});
  });
  const topics={};TKEYS.forEach(k=>topics[k]={c:0,n:0});
  const levels={NB:{c:0,n:0},TH:{c:0,n:0},VD:{c:0,n:0}};
  items.forEach(it=>{topics[it.topic].n++;levels[it.level].n++;if(it.ok){topics[it.topic].c++;levels[it.level].c++;}});
  const total=Math.round((sc.mc+sc.tf+sc.sa)*100)/100;
  return {items,sc,total,topics,levels,errs,qres};
}
function pct(o){return o.n?Math.round(100*o.c/o.n):0;}
function updateWeak(r){
  TKEYS.forEach(k=>{if(r.topics[k].n)state.topicPct[k]=pct(r.topics[k]);});
  state.weak=TKEYS.filter(k=>state.topicPct[k]!==undefined&&state.topicPct[k]<80).sort((a,b)=>state.topicPct[a]-state.topicPct[b]);
}

/* ============ Luyện tập: kiểm tra từng câu ============ */
function setFeed(id,msg,cls){
  const box=document.querySelector(`#q-${id} .feedbox`);
  if(box)box.innerHTML=`<div class="feed ${cls}" role="status">${msg}</div>`;
}
function practiceCheck(id){
  const q=S.list.find(x=>x.id===id);if(!q)return;
  const P=state.pr[id]||(state.pr[id]={attempts:0,done:false,tried:[]});
  if(P.done)return;
  const a=state.ans[id];
  if(q.type==='mc'&&a==null)return setFeed(id,'Hãy chọn một đáp án trước.','info');
  if(q.type==='tf'){const arr=a||[];if(q.items.some((_,j)=>typeof arr[j]!=='boolean'))return setFeed(id,'Hãy chọn Đúng hoặc Sai cho cả 4 ý trước.','info');}
  if(q.type==='sa'&&String(a||'').trim()==='')return setFeed(id,'Hãy nhập đáp án trước.','info');
  P.attempts++;
  const oks=evalQ(q,a),all=oks.every(Boolean);
  if(P.attempts===1){P.first=oks;P.firstAns=JSON.parse(JSON.stringify(a));}
  if(all){
    P.done=true;P.final=true;P.cls='ok';
    P.msg=P.attempts===1?'Đúng rồi!':'Đúng ở lần thử thứ hai.';
  }else if(P.attempts===1){
    P.cls='bad';
    if(q.type==='mc'){
      const e=q.opts[a].err;P.tried.push(a);delete state.ans[id];
      P.msg='Chưa đúng.'+(e?' '+e:'')+' Hãy chọn lại một đáp án khác.';
    }else if(q.type==='tf'){
      const k=oks.filter(Boolean).length;P.msg=`Mới đúng ${k}/${q.items.length} ý. Hãy xem lại các ý và thử một lần nữa.`;
    }else P.msg='Đáp án chưa đúng. Hãy kiểm tra lại cách tính và thử một lần nữa.';
  }else{
    P.done=true;P.final=false;P.cls='bad';P.msg='Chưa đúng. Đáp án và lời giải ở bên dưới.';
  }
  const el=document.getElementById('q-'+id);
  el.outerHTML=CARD[q.type](q,S.idx[id]);
  updateProgress();
}

/* ============ Màn hình: kết quả ============ */
function barRow(label,o){
  const p=pct(o),[cls,txt]=status(p);
  return `<div class="topic"><div class="trow"><b>${label}</b><span class="st ${cls}">${txt} · ${p}%</span></div>
    <div class="track" role="img" aria-label="${label}: ${p}%"><i class="fill-${cls}" style="width:${p}%"></i></div>
    <div class="small muted">${o.c}/${o.n} ý đúng</div></div>`;
}
function makeCode(r){
  const t={};TKEYS.forEach(k=>t[k]=[r.topics[k].c,r.topics[k].n]);
  const o={v:1,n:state.name||'Học sinh',d:new Date().toISOString().slice(0,10),s:r.total,m:state.elapsed,L:LIMIT[S.mode],q:S.mode,k:state.code,p:[r.sc.mc,r.sc.tf,r.sc.sa],t};
  return 'TG7-'+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function setSent(msg,retry){
  const m=document.getElementById('sent');if(!m)return;
  m.innerHTML=msg+(retry?' <button class="btn sm ghost" id="resend">Gửi lại</button>':'');
}
function sendResult(){
  if(!SHEET_URL||!state.result)return;
  const code=makeCode(state.result);
  setSent('Đang gửi kết quả cho giáo viên...');
  fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code})})
    .then(()=>{state.sentCode=code;setSent('Đã gửi kết quả cho giáo viên.');})
    .catch(()=>setSent('Chưa gửi được (có thể mất mạng). Bấm Gửi lại, hoặc gửi mã bên dưới cho giáo viên.',true));
}
function reviewHTML(r){
  const sym=ok=>ok?'<span class="mark-ok">✓ Đúng</span>':'<span class="mark-no">✗ Chưa đúng</span>';
  return r.qres.map(x=>{
    const tp=x.kind==='tf'?'':TOPICS[x.q.topic].short;
    let body='';const head=`${partName(x.kind)} · Câu ${x.i+1}`;
    if(x.kind==='mc'){
      const chosen=x.a==null?'Chưa trả lời':x.q.opts[x.a].t,right=x.q.opts[x.q.ans].t;
      body=`<p class="stem">${x.q.stem}</p>${x.q.fig||''}<p class="ans-line">Bạn chọn: <b>${chosen}</b></p><p class="ans-line">Đáp án đúng: <b>${right}</b></p>`+(x.ok||x.a==null||!x.q.opts[x.a].err?'':`<p class="ans-line mark-no">Lỗi thường gặp: ${x.q.opts[x.a].err}</p>`)+`<div class="exp">${x.q.exp}</div>`;
    }else if(x.kind==='tf'){
      body=`<p class="stem">${x.q.stem}</p>${x.q.fig||''}`+x.q.items.map((it,j)=>{
        const a=x.a[j],your=typeof a==='boolean'?(a?'Đúng':'Sai'):'Chưa chọn';
        return `<div class="exp" style="margin-top:8px">${x.q.items.length>1?`<b>${'abcd'[j]})</b> `:''}${it.t}<br>Bạn chọn: <b>${your}</b> · Đáp án: <b>${it.v?'Đúng':'Sai'}</b> ${sym(x.oks[j])} <span class="chip">${TOPICS[it.topic].short}</span><br><span class="muted">${it.exp}</span></div>`;
      }).join('');
    }else{
      body=`<p class="stem">${x.q.stem}</p>${x.q.fig||''}<p class="ans-line">Bạn nhập: <b>${x.raw?esc(x.raw):'Chưa trả lời'}</b></p><p class="ans-line">Đáp án đúng: <b>${x.q.ans[0]} ${x.q.unit}</b></p><div class="exp">${x.q.exp}</div>`;

    return `<details class="rv"><summary><span><b>${head}</b> ${tp?`<span class="chip">${tp}</span>`:''}</span><span class="small">${right}</span></summary><div class="body">${body}</div></details>`;
  }).join('');
}

  </section>`:''}

  <div class="row" style="margin-top:22px">
    ${state.weak.length?`<button class="btn" id="weakpack">Luyện gói ôn điểm yếu</button>`:''}
    <button class="btn ${state.weak.length?'ghost':''}" id="again">${test?(state.code?'Làm lại đề này':'Làm đề kiểm tra khác'):'Làm gói này lần nữa'}</button>
    <button class="btn ghost" id="home">Về trang đầu</button>
  </div>`;
}

/* ============ Màn hình: giáo viên ============ */
function teacherHTML(){
  return `<section class="hero"><h1>Bảng <em>tổng hợp</em> lớp</h1>
    <p class="lead">Dán mã kết quả bài kiểm tra của học sinh, mỗi mã một dòng. Bảng sẽ cho thấy điểm từng em và nội dung kiến thức cả lớp còn yếu. Mỗi học sinh nhận một đề khác nhau nhưng cùng cấu trúc, nên điểm vẫn so sánh được.</p></section>
    <section class="card stack" style="margin-top:18px">
      <div><label class="fl" for="codes">Mã kết quả</label><textarea id="codes" placeholder="TG7-eyJ2IjoxLC..."></textarea></div>
      <div class="row"><button class="btn" id="analyze">Tổng hợp</button><button class="btn ghost" id="clearc">Xóa</button></div>
      <div id="tout" aria-live="polite"></div>
    </section>`;
}
function decodeCode(line){
  line=line.trim();if(!line.startsWith('TG7-'))return null;
  try{const o=JSON.parse(decodeURIComponent(escape(atob(line.slice(4)))));if(o&&o.t&&typeof o.s==='number')return o;}catch(e){}
  return null;
}
function analyzeCodes(){
  const lines=document.getElementById('codes').value.split(/\r?\n/).filter(l=>l.trim());
  const rows=[],bad=[];
  lines.forEach((l,i)=>{const o=decodeCode(l);if(o)rows.push(o);else bad.push(i+1);});
  const out=document.getElementById('tout');
  if(!rows.length){out.innerHTML=`<div class="warnbar">${lines.length?'Không đọc được mã nào. Hãy kiểm tra mã đã được sao chép đầy đủ, bắt đầu bằng TG7-.':'Hãy dán ít nhất một mã kết quả.'}</div>`;return;}
  const cell=o=>{if(!o||!o[1])return '<td class="cell">–</td>';const p=Math.round(100*o[0]/o[1]);return `<td class="cell ${status(p)[0]}">${p}%</td>`;};
  const avg=TKEYS.map(k=>{let c=0,n=0;rows.forEach(r=>{if(r.t[k]){c+=r.t[k][0];n+=r.t[k][1];}});return [c,n];});
  const mean=rows.reduce((s,r)=>s+r.s,0)/rows.length;
  const timed=rows.filter(r=>typeof r.m==='number'),meanT=timed.length?timed.reduce((s,r)=>s+r.m,0)/timed.length:null;
  const tcell=r=>typeof r.m==='number'?fmtTime(r.m):'–';
  const flag=r=>(typeof r.m==='number'&&r.m<0.25*(r.L||1800)&&r.s<5)?' <span class="chip">Làm nhanh, điểm thấp</span>':'';
  const chips=r=>(r.q==='quick'?' <span class="chip">Nhanh 5 phút</span>':'')+(r.k?` <span class="chip">Mã đề ${esc(r.k)}</span>`:'');
  const weakCount=TKEYS.map(k=>rows.filter(r=>r.t[k]&&r.t[k][1]&&100*r.t[k][0]/r.t[k][1]<50).length);
  const worst=TKEYS.map((k,i)=>({k,p:avg[i][1]?100*avg[i][0]/avg[i][1]:100})).sort((a,b)=>a.p-b.p)[0];
  out.innerHTML=`${bad.length?`<div class="warnbar" style="margin:0 0 12px">Bỏ qua ${bad.length} dòng không đọc được (dòng ${bad.join(', ')}).</div>`:''}
    <p style="margin:0 0 10px"><b>${rows.length}</b> học sinh · điểm trung bình <b>${fmt(mean)}</b>. Nội dung cả lớp còn yếu nhất: <b>${TOPICS[worst.k].name}</b> (${Math.round(worst.p)}%).</p>
    <div class="tablewrap"><table><thead><tr><th>Học sinh</th><th>Điểm</th><th>Thời gian</th>${TKEYS.map(k=>`<th>${TOPICS[k].short}</th>`).join('')}</tr></thead><tbody>
    ${rows.sort((a,b)=>a.s-b.s).map(r=>`<tr><td>${esc(r.n)}${chips(r)}${flag(r)}</td><td><b>${fmt(r.s)}</b></td><td>${tcell(r)}</td>${TKEYS.map(k=>cell(r.t[k])).join('')}</tr>`).join('')}
    <tr><td><b>Cả lớp</b></td><td><b>${fmt(mean)}</b></td><td>${meanT===null?'–':fmtTime(meanT)}</td>${avg.map(cell).join('')}</tr>
    <tr><td class="muted">Số em dưới 50%</td><td></td><td></td>${weakCount.map(n=>`<td class="cell">${n}</td>`).join('')}</tr>
    </tbody></table></div>
    <p class="small muted" style="margin:10px 0 0">Màu: xanh từ 80%, vàng từ 50% đến dưới 80%, đỏ dưới 50%. Các em được xếp từ điểm thấp đến cao để dễ thấy em cần hỗ trợ. Nhãn "Làm nhanh, điểm thấp" hiện khi em nộp bài trong chưa đầy một phần tư thời gian cho phép mà dưới 5 điểm, thường là em chưa làm kỹ nên cần hỏi lại. Mã cũ chưa có thời gian sẽ hiện dấu gạch.</p>`;
}

/* ============ Điều hướng và sự kiện ============ */
function render(){
  const gv=location.hash==='#giao-vien';
  document.getElementById('nav-hs').setAttribute('aria-current',gv?'false':'page');
  document.getElementById('nav-gv').setAttribute('aria-current',gv?'page':'false');
  if(gv){stopTimer();$app.innerHTML=teacherHTML();return;}
  if(state.view==='home'){stopTimer();$app.innerHTML=homeHTML();}
  else if(state.view==='quiz'){$app.innerHTML=quizHTML();updateProgress();startTimer();}
  else{stopTimer();$app.innerHTML=resultHTML();if(SHEET_URL&&S.mode!=='practice'&&state.sentCode!==makeCode(state.result))sendResult();else if(SHEET_URL&&S.mode!=='practice')setSent('Đã gửi kết quả cho giáo viên.');}
  window.scrollTo(0,0);
}
function normCode(s){return String(s||'').trim().toUpperCase().replace(/\s+/g,'');}
function withCode(mode,fn){
  if(!state.code){fn();return;}
  RNG=mulberry32(hashStr(mode+'|'+state.code));SEEDED=true;
  try{fn();}finally{RNG=Math.random;SEEDED=false;}
}
function startTest(){withCode('test',buildTest);state.view='quiz';render();}
function startQuick(){withCode('quick',buildQuick);state.view='quiz';render();}
function startPack(spec){buildPractice(spec);state.view='quiz';render();}
function parsePack(s){
  if(s==='weak')return {kind:'weak',topics:state.weak.slice()};
  const [kind,val]=s.split(':');return {kind,val};
}
function finish(force){
  const test=S.mode!=='practice';
  const left=test?totalItems()-answered():S.list.length-doneCount();
  if(left>0&&!force){
    const w=document.getElementById('warn');
    w.innerHTML=test
      ?`<div class="warnbar" role="alert">Còn <b>${left}</b> ý chưa trả lời. Những ý này sẽ tính là chưa đúng.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn nộp bài</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`
      :`<div class="warnbar" role="alert">Còn <b>${left}</b> câu chưa kiểm tra xong. Những câu này sẽ tính là chưa đúng ngay lần đầu.<div class="row" style="margin-top:10px"><button class="btn sm" id="force">Vẫn xem kết quả</button><button class="btn ghost sm" id="keep">Làm tiếp</button></div></div>`;
    w.scrollIntoView({block:'center'});return;
  }
  stopTimer();
  state.elapsed=Math.floor((Date.now()-state.t0)/1000);
  if(test)state.elapsed=Math.min(state.elapsed,LIMIT[S.mode]);
  state.result=grade();updateWeak(state.result);state.view='result';render();
}
document.addEventListener('click',e=>{
  const pk=e.target.closest('[data-pack]');
  if(pk&&!pk.disabled){startPack(parsePack(pk.dataset.pack));return;}
  const ck=e.target.closest('.chk');
  if(ck){practiceCheck(ck.dataset.q);return;}
  const id=e.target.id;
  if(id==='start'||id==='startq'){state.name=document.getElementById('nm').value.trim();state.code=normCode(document.getElementById('mcode').value);if(id==='start')startTest();else startQuick();}
  else if(id==='submit')finish(false);
  else if(id==='force')finish(true);
  else if(id==='keep')document.getElementById('warn').innerHTML='';
  else if(id==='back'){state.view='home';render();}
  else if(id==='again'){if(S.mode==='test')startTest();else if(S.mode==='quick')startQuick();else startPack(S.spec.kind==='weak'?{kind:'weak',topics:state.weak.length?state.weak.slice():S.spec.topics}:S.spec);}
  else if(id==='weakpack')startPack({kind:'weak',topics:state.weak.slice()});
  else if(id==='home'){state.view='home';render();}
  else if(id==='copy'){
    const t=document.getElementById('code'),m=document.getElementById('copied');
    t.focus();t.select();
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{m.textContent='Đã sao chép.';}).catch(()=>{m.textContent='Hãy nhấn giữ vùng chọn rồi chọn Sao chép.';});
  }
  else if(id==='resend')sendResult();
  else if(id==='analyze')analyzeCodes();
  else if(id==='clearc'){document.getElementById('codes').value='';document.getElementById('tout').innerHTML='';}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.type!=='radio')return;
  const m=t.name.match(/^(.+)-(\d)$/);
  if(m){const a=state.ans[m[1]]||(state.ans[m[1]]=[]);a[+m[2]]=t.value==='1';}
  else state.ans[t.name]=+t.value;
  updateProgress();
});
document.addEventListener('input',e=>{
  const id=e.target.dataset&&e.target.dataset.sa;
  if(id){state.ans[id]=e.target.value;updateProgress();}
});
window.addEventListener('hashchange',render);
render();
</script>
</body>
